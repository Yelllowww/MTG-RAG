[package]
name = "magic_rag"
version = "0.2.0"
edition = "2024"

[dependencies]
flate2 = "1.1.11"
regex = "1.13.2"
rust-stemmers = "1.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.5.2", features = ["json"] }

[profile.release]
opt-level = 3
